name: Microsoft ACS native integration

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/gcp_reference/adapters/microsoft_acs.py"
      - "src/gcp_reference/policy.py"
      - "tests/integration/test_microsoft_acs_live.py"
      - "pyproject.toml"
      - ".github/workflows/acs-integration.yml"
  pull_request:
    paths:
      - "src/gcp_reference/adapters/microsoft_acs.py"
      - "src/gcp_reference/policy.py"
      - "tests/integration/test_microsoft_acs_live.py"
      - "pyproject.toml"
      - ".github/workflows/acs-integration.yml"

permissions:
  contents: read

jobs:
  native-acs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install pinned ACS integration
        run: python -m pip install -e '.[test,acs]'
      - name: Execute native ACS gate
        run: python -m pytest -m acs_live tests/integration/test_microsoft_acs_live.py
