[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gcp-reference"
version = "0.1.0.dev0"
description = "Reference implementation for the Governance Capsule Protocol candidate"
requires-python = ">=3.9"
dependencies = [
  "cryptography>=41",
  "jsonschema>=4.18",
  "referencing>=0.30",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
